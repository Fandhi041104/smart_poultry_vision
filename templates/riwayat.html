<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat - Smart Poultry Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <nav class="bg-gradient-to-r from-blue-900 to-blue-800 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="flex items-center space-x-2 text-white min-w-0">
                    <i class="fas fa-heartbeat text-xl text-emerald-400 flex-shrink-0"></i>
                    <span class="text-base sm:text-xl font-bold truncate">Smart Poultry Vision</span>
                </a>
                <div class="flex space-x-1 flex-shrink-0">
                    <a href="/dashboard" class="px-2 sm:px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 font-medium transition text-xs sm:text-sm">Dashboard</a>
                    <a href="/riwayat" class="px-2 sm:px-4 py-2 rounded-lg text-white bg-white/20 font-medium text-xs sm:text-sm">Riwayat</a>
                    <a href="/edukasi" class="px-2 sm:px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 font-medium transition text-xs sm:text-sm">Edukasi</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-8">

        <div class="mb-5 sm:mb-6">
            <h1 class="text-xl sm:text-3xl font-bold text-gray-900 flex items-center gap-2 sm:gap-3">
                <i class="fas fa-history text-blue-600"></i>
                Riwayat Deteksi
            </h1>
        </div>

        <!-- Filter -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 mb-5 sm:mb-6">
            <h3 class="font-semibold text-gray-700 mb-3 sm:mb-4 flex items-center gap-2 text-xs sm:text-sm uppercase tracking-wide">
                <i class="fas fa-filter text-blue-500"></i> Filter Data
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1 sm:mb-2">Jenis Penyakit</label>
                    <select id="filter-disease" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-xs sm:text-sm">
                        <option value="all">Semua Penyakit</option>
                        <option value="Sehat">Sehat</option>
                        <option value="Coccidiosis">Coccidiosis</option>
                        <option value="Newcastle">Newcastle</option>
                        <option value="Salmonella">Salmonella</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1 sm:mb-2">Dari Tanggal</label>
                    <input type="date" id="filter-from" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-xs sm:text-sm">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1 sm:mb-2">Sampai Tanggal</label>
                    <input type="date" id="filter-to" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-xs sm:text-sm">
                </div>
            </div>

            <!-- Shortcut -->
            <div class="flex flex-wrap gap-2 mt-3 sm:mt-4">
                <span class="text-xs text-gray-500 self-center">Cepat:</span>
                <button onclick="setRange('today')" class="range-btn px-3 py-1 text-xs bg-gray-100 hover:bg-blue-100 hover:text-blue-700 text-gray-600 rounded-full transition font-medium">Hari Ini</button>
                <button onclick="setRange('week')"  class="range-btn px-3 py-1 text-xs bg-gray-100 hover:bg-blue-100 hover:text-blue-700 text-gray-600 rounded-full transition font-medium">7 Hari Terakhir</button>
                <button onclick="setRange('month')" class="range-btn px-3 py-1 text-xs bg-gray-100 hover:bg-blue-100 hover:text-blue-700 text-gray-600 rounded-full transition font-medium">Bulan Ini</button>
                <button onclick="setRange('all')"   class="range-btn px-3 py-1 text-xs bg-gray-100 hover:bg-blue-100 hover:text-blue-700 text-gray-600 rounded-full transition font-medium">Semua Data</button>
            </div>

            <!-- Tombol Aksi -->
            <div class="flex flex-wrap gap-2 sm:gap-3 mt-4 pt-4 border-t border-gray-100">
                <button onclick="applyFilters()" class="flex-1 sm:flex-none px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium text-xs sm:text-sm">
                    <i class="fas fa-search mr-1 sm:mr-2"></i>Cari
                </button>
                <button onclick="resetFilters()" class="flex-1 sm:flex-none px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium text-xs sm:text-sm">
                    <i class="fas fa-redo mr-1 sm:mr-2"></i>Reset
                </button>
                <button onclick="exportToExcel()" class="w-full sm:w-auto sm:ml-auto px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition font-medium text-xs sm:text-sm">
                    <i class="fas fa-file-excel mr-1 sm:mr-2"></i>Export Excel
                </button>
            </div>
        </div>

        <!-- Info filter aktif -->
        <div id="filter-info" class="hidden mb-3 px-3 sm:px-4 py-2 bg-blue-50 border border-blue-200 rounded-lg text-xs sm:text-sm text-blue-700"></div>

        <!-- ===== TABEL (desktop: sm ke atas) ===== -->
        <div class="hidden sm:block bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 sm:px-6 py-3 sm:py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide w-12">No</th>
                        <th class="px-4 sm:px-6 py-3 sm:py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Penyakit</th>
                        <th class="px-4 sm:px-6 py-3 sm:py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Tingkat Keyakinan</th>
                        <th class="px-4 sm:px-6 py-3 sm:py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Tanggal</th>
                        <th class="px-4 sm:px-6 py-3 sm:py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Waktu</th>
                    </tr>
                </thead>
                <tbody id="history-tbody-desktop" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="5" class="px-6 py-10 text-center">
                            <i class="fas fa-spinner fa-spin text-gray-300 text-3xl mb-3 block"></i>
                            <p class="text-gray-400 text-sm">Memuat data...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ===== CARD LIST (mobile only: di bawah sm) ===== -->
        <div class="sm:hidden space-y-3" id="history-cards-mobile">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 text-center">
                <i class="fas fa-spinner fa-spin text-gray-300 text-2xl mb-2 block"></i>
                <p class="text-gray-400 text-sm">Memuat data...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-4 sm:mt-5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-xs sm:text-sm text-gray-500">
                Menampilkan <span class="font-semibold text-gray-700" id="showing-start">0</span>–<span class="font-semibold text-gray-700" id="showing-end">0</span>
                dari <span class="font-semibold text-gray-700" id="total-records">0</span> data
            </div>
            <div class="flex items-center gap-1 sm:gap-2">
                <button onclick="previousPage()" id="btn-prev"
                        class="px-3 sm:px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition text-xs sm:text-sm">
                    <i class="fas fa-chevron-left mr-1"></i>Sebelumnya
                </button>
                <div id="page-numbers" class="flex gap-1"></div>
                <button onclick="nextPage()" id="btn-next"
                        class="px-3 sm:px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition text-xs sm:text-sm">
                    Berikutnya<i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let historyData = [];
        let filteredData = [];
        let currentPage = 1;
        const recordsPerPage = 10;

        loadHistory();

        function loadHistory() {
            fetch('/api/history_all')
                .then(res => res.json())
                .then(data => {
                    historyData = data;
                    filteredData = data;
                    renderHistory();
                })
                .catch(() => {
                    const errHtml = `<div class="text-center py-8">
                        <i class="fas fa-exclamation-circle text-red-300 text-3xl mb-2 block"></i>
                        <p class="text-gray-400 text-sm">Gagal memuat data</p></div>`;
                    document.getElementById('history-tbody-desktop').innerHTML = `<tr><td colspan="5">${errHtml}</td></tr>`;
                    document.getElementById('history-cards-mobile').innerHTML = `<div class="bg-white rounded-xl p-4">${errHtml}</div>`;
                });
        }

        function setRange(type) {
            const today = new Date();
            const fmt = d => d.toISOString().split('T')[0];

            document.getElementById('filter-disease').value = 'all';
            document.getElementById('filter-from').value = '';
            document.getElementById('filter-to').value = '';

            document.querySelectorAll('.range-btn').forEach(btn => {
                btn.className = 'range-btn px-3 py-1 text-xs bg-gray-100 hover:bg-blue-100 hover:text-blue-700 text-gray-600 rounded-full transition font-medium';
            });
            event.target.className = 'range-btn px-3 py-1 text-xs bg-blue-600 text-white rounded-full transition font-medium';

            if (type === 'today') {
                document.getElementById('filter-from').value = fmt(today);
                document.getElementById('filter-to').value = fmt(today);
            } else if (type === 'week') {
                const from = new Date(today);
                from.setDate(today.getDate() - 6);
                document.getElementById('filter-from').value = fmt(from);
                document.getElementById('filter-to').value = fmt(today);
            } else if (type === 'month') {
                document.getElementById('filter-from').value = fmt(new Date(today.getFullYear(), today.getMonth(), 1));
                document.getElementById('filter-to').value = fmt(today);
            }

            applyFilters();
        }

        function applyFilters() {
            const disease  = document.getElementById('filter-disease').value;
            const fromDate = document.getElementById('filter-from').value;
            const toDate   = document.getElementById('filter-to').value;

            filteredData = historyData.filter(item => {
                const d = item.timestamp.split(' ')[0];
                if (disease !== 'all' && item.disease !== disease) return false;
                if (fromDate && d < fromDate) return false;
                if (toDate  && d > toDate)   return false;
                return true;
            });
            currentPage = 1;
            updateFilterInfo(disease, fromDate, toDate);
            renderHistory();
        }

        function updateFilterInfo(disease, fromDate, toDate) {
            const el = document.getElementById('filter-info');
            const parts = [];
            if (disease !== 'all') parts.push(`Penyakit: <strong>${disease}</strong>`);
            if (fromDate) parts.push(`Dari: <strong>${fromDate}</strong>`);
            if (toDate)   parts.push(`Sampai: <strong>${toDate}</strong>`);
            if (parts.length > 0) {
                el.innerHTML = `<i class="fas fa-info-circle mr-1"></i>Filter aktif — ${parts.join(' &nbsp;|&nbsp; ')} &nbsp;(${filteredData.length} hasil)`;
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function resetFilters() {
            document.getElementById('filter-disease').value = 'all';
            document.getElementById('filter-from').value = '';
            document.getElementById('filter-to').value = '';
            filteredData = historyData;
            currentPage = 1;
            document.getElementById('filter-info').classList.add('hidden');
            renderHistory();
        }

        const badge = {
            'Sehat':       'bg-emerald-100 text-emerald-800',
            'Coccidiosis': 'bg-amber-100 text-amber-800',
            'Newcastle':   'bg-red-100 text-red-800',
            'Salmonella':  'bg-pink-100 text-pink-800'
        };

        function renderHistory() {
            const total      = filteredData.length;
            const totalPages = Math.ceil(total / recordsPerPage);
            const startIdx   = (currentPage - 1) * recordsPerPage;
            const endIdx     = Math.min(startIdx + recordsPerPage, total);
            const pageData   = filteredData.slice(startIdx, endIdx);

            document.getElementById('total-records').textContent  = total;
            document.getElementById('showing-start').textContent  = total > 0 ? startIdx + 1 : 0;
            document.getElementById('showing-end').textContent    = endIdx;
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = currentPage === totalPages || total === 0;

            if (total === 0) {
                const empty = `<div class="text-center py-10">
                    <i class="fas fa-inbox text-gray-300 text-3xl mb-2 block"></i>
                    <p class="text-gray-400 text-sm">Tidak ada data yang sesuai</p></div>`;
                document.getElementById('history-tbody-desktop').innerHTML = `<tr><td colspan="5">${empty}</td></tr>`;
                document.getElementById('history-cards-mobile').innerHTML  = `<div class="bg-white rounded-xl p-4">${empty}</div>`;
                renderPageNumbers(0);
                return;
            }

            // ---- Render tabel desktop ----
            document.getElementById('history-tbody-desktop').innerHTML = pageData.map((item, idx) => {
                const [date, time] = item.timestamp.split(' ');
                return `<tr class="hover:bg-gray-50 transition">
                    <td class="px-4 sm:px-6 py-3 sm:py-4 text-sm text-gray-500">${startIdx + idx + 1}</td>
                    <td class="px-4 sm:px-6 py-3 sm:py-4">
                        <span class="px-2 sm:px-3 py-1 rounded-full text-xs font-semibold ${badge[item.disease] || 'bg-gray-100 text-gray-800'}">${item.disease}</span>
                    </td>
                    <td class="px-4 sm:px-6 py-3 sm:py-4">
                        <div class="flex items-center gap-2 sm:gap-3">
                            <div class="flex-1 bg-gray-200 rounded-full h-2 max-w-[120px]">
                                <div class="h-2 rounded-full bg-gradient-to-r from-blue-500 to-blue-600" style="width:${item.confidence}%"></div>
                            </div>
                            <span class="text-xs sm:text-sm font-semibold text-gray-700 w-10 text-right">${Math.round(item.confidence)}%</span>
                        </div>
                    </td>
                    <td class="px-4 sm:px-6 py-3 sm:py-4 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${date}</td>
                    <td class="px-4 sm:px-6 py-3 sm:py-4 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${time}</td>
                </tr>`;
            }).join('');

            // ---- Render card mobile ----
            document.getElementById('history-cards-mobile').innerHTML = pageData.map((item, idx) => {
                const [date, time] = item.timestamp.split(' ');
                const badgeClass = badge[item.disease] || 'bg-gray-100 text-gray-800';
                return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-400 font-medium">#${startIdx + idx + 1}</span>
                            <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${badgeClass}">${item.disease}</span>
                        </div>
                        <span class="text-xs text-gray-500">${date}</span>
                    </div>
                    <div class="flex items-center gap-3 mt-1">
                        <div class="flex-1 bg-gray-200 rounded-full h-2">
                            <div class="h-2 rounded-full bg-gradient-to-r from-blue-500 to-blue-600" style="width:${item.confidence}%"></div>
                        </div>
                        <span class="text-xs font-semibold text-gray-700 w-9 text-right">${Math.round(item.confidence)}%</span>
                    </div>
                    <p class="text-xs text-gray-400 mt-2"><i class="fas fa-clock mr-1"></i>${time}</p>
                </div>`;
            }).join('');

            renderPageNumbers(totalPages);
        }

        function renderPageNumbers(totalPages) {
            const container = document.getElementById('page-numbers');
            container.innerHTML = '';
            if (totalPages <= 1) return;
            const max = 3;
            let start = Math.max(1, currentPage - 1);
            let end   = Math.min(totalPages, start + max - 1);
            if (end - start < max - 1) start = Math.max(1, end - max + 1);
            for (let i = start; i <= end; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === currentPage
                    ? 'px-2 sm:px-3 py-2 bg-blue-600 text-white rounded-lg text-xs sm:text-sm font-semibold'
                    : 'px-2 sm:px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition text-xs sm:text-sm';
                btn.onclick = () => { currentPage = i; renderHistory(); };
                container.appendChild(btn);
            }
        }

        function previousPage() { if (currentPage > 1) { currentPage--; renderHistory(); } }
        function nextPage() {
            if (currentPage < Math.ceil(filteredData.length / recordsPerPage)) { currentPage++; renderHistory(); }
        }
        function exportToExcel() {
            const disease  = document.getElementById('filter-disease').value;
            const fromDate = document.getElementById('filter-from').value;
            const toDate   = document.getElementById('filter-to').value;

            const params = new URLSearchParams();
            if (disease !== 'all') params.append('disease', disease);
            if (fromDate) params.append('from', fromDate);
            if (toDate)   params.append('to', toDate);

            window.location.href = '/api/export_history?' + params.toString();
        }
    </script>
</body>
</html>
